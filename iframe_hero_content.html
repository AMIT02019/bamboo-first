<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https://static.wixstatic.com data:; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'unsafe-inline'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
body{font-family:'Inter',sans-serif;background:#2b1a08}

.bk{
  --green:#1f3d2b;
  --ink:#14301f;
  --gold:#8a5a1a;
  --thread:#a8531f;
  position:relative;
  min-height:100vh;
  background:var(--bg) center/cover no-repeat;
  display:flex;align-items:flex-start;justify-content:center;
  overflow:hidden;
}
.bk::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 55%,
    rgba(255,246,225,.80) 0%,
    rgba(255,240,210,.58) 45%,
    rgba(255,240,210,0) 78%);
}
.wrap{
  position:relative;z-index:1;width:100%;max-width:1400px;
  padding:0 40px 48px;text-align:center;
}

/* ---------- Kandils (top) ---------- */
.grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:10px;align-items:start;
}
.card{position:relative}
.imgwrap{position:relative}

/* thread hanging from the top of the section */
.imgwrap::before{
  content:"";position:absolute;z-index:0;
  left:50%;width:1.5px;margin-left:-.75px;
  bottom:calc(100% - 8px);height:1600px;
  background:linear-gradient(to bottom,rgba(168,83,31,.55),var(--thread));
}

.glow{
  position:absolute;left:50%;top:50%;width:120%;aspect-ratio:1;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,
    rgba(255,215,100,.95) 0%,
    rgba(255,150,30,.5) 35%,
    rgba(255,150,30,0) 70%);
  opacity:0;
  transition:opacity 1.4s ease-in-out;
  pointer-events:none;z-index:0;
}
.card img{
  position:relative;z-index:1;display:block;
  width:130%;max-width:none;margin-left:-15%;height:auto;
  transform-origin:top center;
  transition:filter 1.4s ease-in-out;
  filter:drop-shadow(0 6px 10px rgba(80,40,0,.25));
  will-change:transform;
}

.name{
  position:relative;z-index:1;margin-top:0;
  font-family:'Inter',sans-serif;font-weight:700;
  font-size:clamp(21px,2.6vw,32px);line-height:1.15;
  color:var(--ink);text-shadow:0 1px 3px rgba(255,244,220,.9);
}
.note{
  display:block;margin-top:2px;
  font-weight:600;font-size:.62em;color:var(--ink);
}
.name::after{
  content:"";display:block;width:26px;height:1.5px;background:var(--gold);
  margin:8px auto 6px;opacity:.8;
}
.price{
  position:relative;z-index:1;
  font-family:'Inter',sans-serif;font-weight:700;
  font-size:clamp(19px,2.1vw,26px);
  color:var(--ink);text-shadow:0 1px 3px rgba(255,244,220,.9);
}

/* lit state: glow only (movement is handled in the script) */
.card.is-lit .glow{opacity:.7}
.card.is-lit img{
  filter:brightness(1.1) saturate(1.14)
    drop-shadow(0 0 10px rgba(255,210,90,.7))
    drop-shadow(0 0 28px rgba(255,140,20,.56));
}

/* ---------- Text (below) ---------- */
h1{
  font-family:'Cormorant Garamond',serif;font-weight:700;
  font-size:clamp(42px,7vw,76px);line-height:1.05;color:var(--green);margin-top:40px;
}
.about{
  font-family:'Cormorant Garamond',serif;font-weight:500;
  font-size:clamp(10px,2.9vw,26px);line-height:1.3;color:#1d2b21;
  white-space:nowrap;margin:2px auto 0;
}
.about::before{
  content:"";display:block;width:140px;height:1px;
  background:var(--gold);opacity:.6;margin:0 auto 8px;
}

.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:22px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  padding:15px 28px;border-radius:999px;text-decoration:none;
  font-size:15px;font-weight:500;transition:transform .2s ease,box-shadow .2s ease;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.18)}
.btn.primary{background:var(--green);color:#fff}
.btn.ghost{border:1px solid var(--green);color:var(--green);background:rgba(255,255,255,.4)}
.btn svg{width:20px;height:20px;fill:currentColor}

@media(max-width:700px){
  .wrap{padding:32px 24px 36px}
  .grid{grid-template-columns:repeat(2,1fr);gap:18px 6px}
  .imgwrap::before{display:none}   /* no thread on mobile */
  .name{font-size:19px}
  .price{font-size:19px}
  h1{margin-top:30px}
  .about{margin-top:2px}
  .btns{flex-direction:column;align-items:center}
  .btn{width:100%;max-width:320px}
}
</style>

<section class="bk" id="bk">
  <div class="wrap">

    <div class="grid" id="grid"></div>

    <h1>Bamboo Kandil</h1>
    <p class="about">Handcrafted in bamboo by tribal women artisans of Vikramgad, Palghar.</p>

    <div class="btns">
      <a class="btn primary" id="wa" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
        Order on WhatsApp
      </a>
      <a class="btn ghost" id="call">
        <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        <span id="calltxt"></span>
      </a>
    </div>
  </div>
</section>

<script>
(function(){
"use strict";

/* ===== EDIT HERE ===== */
var BG = "https://static.wixstatic.com/media/e0afb1_8b1493be9c4249cca1365fcacb4bb740~mv2.webp";
var WA_NUMBER = "917021490824";          // WhatsApp: country code + number
var CALL_NUMBER = "917021490824";        // Call: country code + number
var CALL_LABEL = "+91 70214 90824";      // Text shown on the call button
var KANDILS = [
  {name:"Sahyadri (Big)", note:"(Non-Foldable)", price:"₹900", img:"https://static.wixstatic.com/media/e0afb1_4dbcc33fc0d34673ad029043a0b244d6~mv2.png"},
  {name:"Anjaneri (Big)", note:"(Foldable)", price:"₹900", img:"https://static.wixstatic.com/media/e0afb1_94e62963a690422d9a3484f71fa6dd59~mv2.png"},
  {name:"Shivneri (Big)", note:"(Non-Foldable)", price:"₹900", img:"https://static.wixstatic.com/media/e0afb1_a150e148f33a4005b874609dc153e578~mv2.png"},
  {name:"Purandar (Big)", note:"(Non-Foldable)", price:"₹900", img:"https://static.wixstatic.com/media/e0afb1_e8174ce79bac4e66823236c801c02d88~mv2.png"}
];
/* ===================== */

/* Each kandil moves differently: own strength, speed and starting point */
var MOTION = [
  {amp:1.0, speed:1.10, phase:0.0, phase2:1.3},
  {amp:0.7, speed:1.55, phase:2.4, phase2:0.4},
  {amp:1.1, speed:0.90, phase:4.1, phase2:2.6},
  {amp:0.8, speed:1.30, phase:1.2, phase2:3.8}
];

/* ---------- safety helpers ---------- */
var SAFE_URL = /^https:\/\/static\.wixstatic\.com\/[\w\-.~\/%]+$/;
function safeUrl(u){return (typeof u==="string" && SAFE_URL.test(u)) ? u : "";}
function digits(s){return String(s).replace(/\D/g,"");}

var section = document.getElementById("bk");
var bg = safeUrl(BG);
if(bg){section.style.setProperty("--bg","url('"+bg+"')");}

var wa = digits(WA_NUMBER), call = digits(CALL_NUMBER);
document.getElementById("wa").href =
  "https://wa.me/"+wa+"?text="+encodeURIComponent("Hi, I would like to order a Bamboo Kandil.");
document.getElementById("call").href = "tel:+"+call;
document.getElementById("calltxt").textContent = "Call " + CALL_LABEL;

/* ---------- build cards without innerHTML ---------- */
function el(tag, cls){var e=document.createElement(tag); if(cls)e.className=cls; return e;}

var grid = document.getElementById("grid");
var cards = [], imgs = [];

KANDILS.forEach(function(k){
  var src = safeUrl(k.img);
  if(!src) return;

  var card = el("div","card");
  var wrap = el("div","imgwrap");
  var glow = el("div","glow");
  var img = el("img");
  img.src = src;
  img.alt = k.name + " bamboo kandil";
  img.loading = "lazy";
  img.decoding = "async";
  img.referrerPolicy = "no-referrer";
  wrap.appendChild(glow);
  wrap.appendChild(img);

  var name = el("div","name");
  name.appendChild(document.createTextNode(k.name));
  if(k.note){
    var note = el("span","note");
    note.textContent = k.note;
    name.appendChild(note);
  }
  var price = el("div","price");
  price.textContent = k.price;

  card.appendChild(wrap);
  card.appendChild(name);
  card.appendChild(price);
  grid.appendChild(card);
  cards.push(card);
  imgs.push(img);
});

/* ---------- smooth movement (eases in and out) ---------- */
var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var intensity = 0, target = 0, last = 0, raf = 0;

function frame(now){
  var dt = Math.min((now - last)/1000, 0.1);
  last = now;
  intensity += (target - intensity) * (1 - Math.exp(-dt/0.55));
  if(Math.abs(target - intensity) < 0.002){intensity = target;}

  var t = now/1000;
  for(var i=0;i<imgs.length;i++){
    var m = MOTION[i % MOTION.length];
    var a = t*m.speed + m.phase;
    var deg = m.amp * (Math.sin(a) + 0.35*Math.sin(a*2.3 + m.phase2)) * intensity;
    imgs[i].style.transform = "rotate("+deg.toFixed(3)+"deg)";
  }

  if(target > 0 || intensity > 0){
    raf = requestAnimationFrame(frame);
  }else{
    raf = 0;
    for(var j=0;j<imgs.length;j++){imgs[j].style.transform = "";}
  }
}

function setLit(on){
  cards.forEach(function(c){c.classList.toggle("is-lit", on);});
  target = on ? 1 : 0;
  if(!reduce && !raf){
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }
}

/* ---------- triggers ---------- */
var isDesktop = window.matchMedia("(hover:hover) and (pointer:fine)").matches;

if(isDesktop){
  // desktop: hovering anywhere on the section lights all kandils
  section.addEventListener("mouseenter", function(){setLit(true);});
  section.addEventListener("mouseleave", function(){setLit(false);});
}else if("IntersectionObserver" in window){
  // mobile: no tap interaction, animate only while the section is on screen
  new IntersectionObserver(function(entries){
    setLit(entries[0].isIntersecting);
  },{threshold:0.1}).observe(section);
}
})();
</script>
